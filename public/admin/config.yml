# =========================================================
# Decap CMS 設定ファイル — mayu. portfolio
# =========================================================

backend:
  name: turbo-github
  turbo_site_id: 678d80da-014b-4b5e-9bb8-73e272c4a546

# 画像のデフォルト保存場所（コレクションごとに上書き可能）
media_folder: "/public/images"
public_folder: "/portfoliover1/images"

# サイトURL（プレビューリンクに使用）
site_url: https://mayu19618-cmd.github.io/portfoliover1

# 日本語設定
locale: ja

collections:

  # =========================================================
  # プロフィール
  # =========================================================
  - name: profile
    label: "プロフィール"
    media_folder: "/public/images/profile"
    public_folder: "/portfoliover1/images/profile"
    files:
      - name: main
        label: "プロフィール設定"
        file: "content/profile.json"
        format: json
        fields:
          - label: "名前"
            name: name
            widget: string
            hint: "例：mayu."

          - label: "肩書き"
            name: role
            widget: string
            hint: "例：Graphic Designer / Web Designer"

          - label: "プロフィール写真"
            name: photo
            widget: image
            required: false
            hint: "縦長（4:5）推奨。未設定の場合はプレースホルダーが表示されます"

          - label: "キャッチコピー（日本語）"
            name: taglineJa
            widget: string
            required: false
            hint: "About セクションで使用（現在は未使用）"

          - label: "自己紹介文"
            name: bio
            widget: text
            hint: "改行は実際の表示に反映されます"

          - label: "特徴・強み"
            name: features
            widget: list
            hint: "About セクションの横線区切りリストに表示されます"
            fields:
              - label: "見出し"
                name: heading
                widget: string
                hint: "例：デザインへの想い"
              - label: "本文"
                name: body
                widget: text

  # =========================================================
  # サイト基本情報
  # =========================================================
  - name: site
    label: "サイト基本情報"
    files:
      - name: main
        label: "サイト設定"
        file: "content/site.json"
        format: json
        fields:
          - label: "Hero：英語サブテキスト"
            name: heroEyebrow
            widget: string
            hint: "PORTFOLIO の上に表示されるサブテキスト"

          - label: "Hero：日本語キャッチコピー"
            name: heroTaglineJa
            widget: string
            hint: "PORTFOLIO の下に表示されるキャッチコピー"

          - label: "お問い合わせメールアドレス"
            name: contactEmail
            widget: string
            hint: "Contact セクションのボタン・テキストに使用されます"

          - label: "お問い合わせ本文"
            name: contactText
            widget: text
            required: false
            hint: "改行は実際の表示に反映されます"

          - label: "Instagram URL"
            name: instagramUrl
            widget: string
            required: false
            hint: "空欄にすると SNS リンクが非表示になります"

          - label: "X / Twitter URL"
            name: twitterUrl
            widget: string
            required: false

          - label: "Pinterest URL"
            name: pinterestUrl
            widget: string
            required: false

  # =========================================================
  # スキル
  # =========================================================
  - name: skills
    label: "スキル"
    files:
      - name: main
        label: "スキル一覧"
        file: "content/skills.json"
        format: json
        fields:
          - label: "スキルグループ"
            name: groups
            widget: list
            hint: "カテゴリーごとにグループを追加してください"
            fields:
              - label: "カテゴリー名"
                name: category
                widget: string
                hint: "例：Design / Web / Marketing"
              - label: "スキル"
                name: skills
                widget: list
                fields:
                  - label: "スキル名"
                    name: name
                    widget: string
                    hint: "例：Adobe Illustrator"
                  - label: "レベル（1〜5）"
                    name: level
                    widget: number
                    value_type: int
                    min: 1
                    max: 5
                    default: 3
                    hint: "1＝初心者 / 3＝中級 / 5＝上級"

  # =========================================================
  # 作品コレクション
  # =========================================================
  - name: works
    label: "作品"
    label_singular: "作品1件"
    folder: content/works
    media_folder: "/public/images/works"
    public_folder: "/portfoliover1/images/works"
    create: true
    delete: true
    slug: "{{slug}}"
    format: json
    identifier_field: title
    summary: "{{order}}. {{title}} — {{category}} ({{year}})"
    sortable_fields:
      - order
      - title
      - year
    view_groups:
      - label: カテゴリー
        field: category
      - label: 公開状態
        field: published

    fields:
      # ── 公開設定 ──────────────────────────────────
      - label: "公開状態"
        name: published
        widget: boolean
        default: true
        hint: "ONにすると一覧ページに表示されます。OFFで非公開（下書き）になります。"

      - label: "表示順序"
        name: order
        widget: number
        default: 999
        value_type: int
        min: 1
        max: 999
        hint: "数字が小さいほど先に表示されます（1が最初）"

      # ── 基本情報 ──────────────────────────────────
      - label: "作品名"
        name: title
        widget: string
        hint: "例：Sakura Café ブランディング"

      - label: "カテゴリー"
        name: category
        widget: select
        options:
          - { label: "Web Design（HP・LP）", value: "Web Design" }
          - { label: "Graphic Design（バナー・サムネイル）", value: "Graphic Design" }
          - { label: "Branding（ロゴ・ブランドデザイン）", value: "Branding" }
          - { label: "Other Works", value: "Other Works" }

      - label: "制作年"
        name: year
        widget: number
        default: 2024
        value_type: int
        min: 2000
        max: 2099

      - label: "制作期間"
        name: duration
        widget: string
        required: false
        hint: "例：2024年3月〜4月（約2ヶ月）"

      # ── 画像 ──────────────────────────────────────
      - label: "サムネイル画像"
        name: thumbnail
        widget: image
        required: false
        hint: "WORKS一覧に表示されるメイン画像（推奨：横長 1200×800px 以上）"

      - label: "サムネイル画像の説明文"
        name: thumbnailAlt
        widget: string
        hint: "スクリーンリーダー用のalt テキスト（例：○○のWebサイトデザイン）"

      - label: "背景カラー（画像なしの場合）"
        name: color
        widget: color
        default: "#F7D4DF"
        hint: "サムネイル画像がない場合に表示される背景色"

      - label: "詳細画像（複数可）"
        name: images
        widget: list
        required: false
        hint: "作品詳細ページに表示する画像を追加してください"
        fields:
          - label: "画像"
            name: url
            widget: image
          - label: "画像の説明文（alt）"
            name: alt
            widget: string
            hint: "例：ロゴデザインのカラーバリエーション"

      # ── 作品説明 ──────────────────────────────────
      - label: "制作概要"
        name: overview
        widget: text
        hint: "この作品の概要を2〜3文で説明してください"

      - label: "制作目的"
        name: purpose
        widget: text
        hint: "なぜこのデザインを制作したか（クライアントのゴール・課題）"

      - label: "ターゲット"
        name: target
        widget: string
        hint: "例：20〜30代の女性、カフェ巡りが好きなライフスタイル層"

      - label: "デザインコンセプト"
        name: concept
        widget: text
        hint: "デザインの方向性・世界観・こだわりを説明してください"

      # ── ツール・ポイント ──────────────────────────
      - label: "使用ツール"
        name: tools
        widget: list
        hint: "使用したツールをひとつずつ入力してください（例：Figma、Adobe Illustrator）"

      - label: "工夫したポイント"
        name: highlights
        widget: list
        hint: "制作で工夫した点・こだわりを箇条書きで入力してください"

      # ── リンク ───────────────────────────────────
      - label: "公開サイトURL"
        name: siteUrl
        widget: string
        required: false
        hint: "サイトを公開している場合はURLを入力（例：https://example.com）"
