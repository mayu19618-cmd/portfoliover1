name: GitHub Pages へデプロイ

on:
  push:
    branches: [main]
  # Decap CMS 管理画面から作品を追加・編集したときも自動実行
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 依存パッケージをインストール
        run: npm ci

      - name: サイトをビルド
        run: npm run build
        env:
          # 公開先パス:
          #   https://mayu19618-cmd.github.io/portfoliover1/ → /portfoliover1/
          #   https://mayu19618-cmd.github.io/ → / (またはこの行を削除)
          BASE_PATH: /portfoliover1/

      - name: SPA ルーティング用 404.html を作成
        run: cp dist/index.html dist/404.html

      - name: GitHub Pages アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
